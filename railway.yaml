# Railway Configuration - Full Stack Deployment
version: 2

# Backend API Service
services:
  - name: api
    source: 
      root: /
    build:
      builder: NIXPACKS
      buildCommand: npm install
      startCommand: npm start
    healthcheck:
      path: /api/status
      port: 3000
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend Static Site
  - name: web
    source:
      root: /
    build:
      builder: STATIC
      startCommand: python3 -m http.server $PORT
    healthcheck:
      path: /
      port: 8000
      interval: 10s
      timeout: 5s
      retries: 3

# Variables de ambiente (configure no painel Railway)
# - NODE_ENV=production
# - PORT=3000
# - ADMIN_USER=admin
# - ADMIN_PASS=admin123
